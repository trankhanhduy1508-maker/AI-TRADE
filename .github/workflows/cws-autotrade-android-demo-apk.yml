name: CWS AutoTrade Android DEMO APK

on:
  push:
    branches:
      - codex/p0-covel-knowledge-audit
    paths:
      - '.github/workflows/cws-autotrade-android-demo-apk.yml'
      - 'android/**'
      - 'tests/android/**'
      - 'tests/execution/test_mt5_cloud_metaapi.py'

permissions:
  contents: read

concurrency:
  group: autotrade-demo-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout committed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reuse Android SDK
        run: |
          test -d "${ANDROID_HOME:?Android SDK unavailable}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;35.0.0"

      - name: Build DEMO debug APK
        run: |
          gradle --no-daemon -p android :app:assembleDebug --stacktrace
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          sha256sum "$APK" | tee "$RUNNER_TEMP/CWS-AutoTrade-DEMO-debug.sha256"
          cp "$APK" "$RUNNER_TEMP/CWS-AutoTrade-DEMO-debug.apk"

      - name: Upload DEMO debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CWS-AutoTrade-DEMO-debug
          path: |
            ${{ runner.temp }}/CWS-AutoTrade-DEMO-debug.apk
            ${{ runner.temp }}/CWS-AutoTrade-DEMO-debug.sha256
          if-no-files-found: error
          retention-days: 7
