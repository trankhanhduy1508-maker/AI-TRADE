name: CWS AI Trade Android debug APK

on:
  push:
    branches: [codex/p0-covel-knowledge-audit]
    paths:
      - 'android/**'
      - '.github/workflows/cws-ai-trade-android-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: SDK platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Assemble debug APK
        run: gradle -p android --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload temporary debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: cws-ai-trade-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
